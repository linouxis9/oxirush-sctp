# The blocks of the README that use other crates of the family: oxirush-sctp with them,
# at the versions that this manifest names. A package of its own, so that the crate
# depends on none of them: nothing here is published. `cargo test` here runs the
# blocks and compares what they print with the README.
[package]
name = "oxirush-sctp-family"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dev-dependencies]
oxirush-sctp = { path = ".." }
oxirush-ngap = "0.5"
tokio = { version = "1.34", features = ["macros", "rt"] }

# Not a member of a workspace that the crate may be in.
[workspace]
