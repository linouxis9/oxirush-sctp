name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Rust version, and the current one
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # The tests open associations over loopback, and two of them send 4 MiB.
      - name: Load SCTP
        run: |
          sudo modprobe sctp
          sudo sysctl -w net.core.wmem_max=8388608 net.core.rmem_max=8388608
      - run: cargo test
      - run: cargo test --release

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: sudo modprobe sctp
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/Cargo.toml
      - run: cargo fmt --check --manifest-path benches/compare/Cargo.toml

  bench:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - run: sudo modprobe sctp
      # Each benchmark once, without timing: the figures of a shared runner
      # say nothing
      - run: cargo test --manifest-path benches/Cargo.toml --benches
      - run: cargo clippy --manifest-path benches/Cargo.toml --all-targets -- -D warnings

  fuzz:
    name: Fuzz ${{ matrix.target }} (1 minute)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [notification, ancillary, receive]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=512

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package

  # The blocks of the README that use other crates of the family: `family/` is a
  # package of its own, which takes them at the versions of its manifest, so that the
  # crate depends on none of them. It compares what each block prints with the README.
  family:
    name: The README blocks with the other crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: family
      # The blocks open associations over loopback
      - run: sudo modprobe sctp
      - run: cargo test --manifest-path family/Cargo.toml
      - run: cargo clippy --manifest-path family/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path family/Cargo.toml
