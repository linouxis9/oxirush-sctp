[package]
name = "oxirush-sctp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async SCTP sockets for Tokio on the Linux kernel SCTP stack"
categories = ["network-programming", "asynchronous"]
keywords = ["sctp", "tokio", "linux", "ngap", "s1ap"]
readme = "README.md"
repository = "https://github.com/linouxis9/oxirush-sctp"
documentation = "https://docs.rs/oxirush-sctp"
license = "Apache-2.0 OR MIT"
exclude = [".github/", ".gitignore", "benches/", "fuzz/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
os_socketaddr = { version = "0.2.4" }
libc = { version = "0.2.145" }
tokio = { version = "1.32", features = ["net", "rt", "sync", "time"] }
tracing = { version = "0.1.40", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.32", features = ["macros", "rt", "rt-multi-thread", "time"] }

# `cargo fuzz` builds the crate with `--cfg fuzzing`, which gives the fuzz
# targets the module `fuzzing`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
