[package]
name = "oxirush-sctp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async SCTP for Tokio on the Linux kernel stack (RFC 6458): one-to-one and one-to-many sockets, multihoming, notifications, and batched sends and receives."
categories = ["network-programming", "asynchronous"]
keywords = ["sctp", "tokio", "linux", "ngap", "s1ap"]
readme = "README.md"
repository = "https://github.com/linouxis9/oxirush-sctp"
documentation = "https://docs.rs/oxirush-sctp"
license = "Apache-2.0 OR MIT"
exclude = [".github/", ".gitignore", "benches/", "family/", "fuzz/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
os_socketaddr = { version = "0.2.4" }
libc = { version = "0.2.149" }
tokio = { version = "1.34", features = ["net", "rt", "sync", "time"] }
tracing = { version = "0.1.40", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["macros", "rt", "rt-multi-thread", "time"] }

# `cargo fuzz` builds the crate with `--cfg fuzzing`, which gives the fuzz
# targets the module `fuzzing`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[package.metadata.docs.rs]
# The crate is for Linux: docs.rs builds it for this target alone.
targets = ["x86_64-unknown-linux-gnu"]
