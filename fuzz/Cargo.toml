[package]
name = "oxirush-sctp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxirush-sctp = { path = ".." }

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "notification"
path = "fuzz_targets/notification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ancillary"
path = "fuzz_targets/ancillary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive"
path = "fuzz_targets/receive.rs"
test = false
doc = false
bench = false
