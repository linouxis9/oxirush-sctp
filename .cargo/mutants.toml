# What cargo-mutants 27.1.0 (https://mutants.rs) changes in the crate, and what it
# leaves alone. .github/workflows/mutants.yml runs every mutant in shards; here, a
# file or a function at a time, with the SCTP module of the kernel loaded:
#
#     cargo mutants -f src/internal/receive.rs
#
# The CI of the crate is the same build without debug information
# (CARGO_PROFILE_DEV_DEBUG=0), which builds and links each mutant faster.

# The readers that `cargo fuzz` drives, which it builds with `--cfg fuzzing`: no build
# that the tests run on has them.
exclude_globs = ["src/internal/fuzzing.rs"]

# Mutants that no test can tell from the code, each with why, named by their function. A
# column tells apart the mutants of the same name in one function.
exclude_re = [
    # Flags of distinct bits: `^` joins them as `|` does. SOCK_NONBLOCK, SOCK_CLOEXEC and
    # the type of a socket; MSG_NOSIGNAL and MSG_MORE; the heartbeat flags of a path.
    'src/internal/sys/descriptor\.rs:.*: replace \| with \^ in (sctp_peeloff_internal|sctp_socket_internal|accept_once)$',
    'src/internal/sys/batch\.rs:.*: replace \| with \^ in send_from$',
    'src/options\.rs:.*: replace \| with \^ in SocketOptions<.*>::set_peer_address_params$',
    # A descriptor of 0 from a call that makes one, the peeled-off association's among
    # them: 0 is the standard input, which the process has open, so no call returns it.
    'src/internal/sys/descriptor\.rs:.*: replace < with <= in (sctp_peeloff_internal|sctp_socket_internal|accept_once)$',
    # A connect of a socket that does not block returns -1 (EINPROGRESS) when it starts
    # an association, never 0 (sctp_wait_for_connect).
    'src/internal/sys/descriptor\.rs:.*: replace < with <= in initiate_connect$',
    # `sendmmsg` and `recvmmsg` of one message at least return 1 at least, or -1.
    'src/internal/sys/batch\.rs:.*: replace < with <= in (send_from|sctp_recvmmsg_once)$',
    # `getsockname` of a socket does not fail.
    'src/internal/sys/addresses\.rs:.*: replace < with > in local_addr$',
    # `shutdown` of a connected socket does not fail: Linux keeps a socket of one
    # association ESTABLISHED after its association has ended, aborted or shut down
    # (inet_shutdown).
    'src/internal/sys/descriptor\.rs:.*: replace < with > in shutdown_internal$',
    # The buffer of the addresses of an association grows otherwise: another error than
    # ENOMEM is tried again with a larger buffer, up to the largest, and then returned
    # alike; 2 octets more each time come to the same addresses after more tries; and
    # past the largest, 1 MiB, the 65,536 addresses of IPv4 that it holds, which no test
    # binds (Linux binds addresses in a time quadratic in their number).
    'src/internal/sys/addresses\.rs:.*: replace && with \|\| in sctp_getaddrs_internal$',
    'src/internal/sys/addresses\.rs:\d+:71: replace < with <= in sctp_getaddrs_internal$',
    'src/internal/sys/addresses\.rs:.*: replace \*= with \+= in sctp_getaddrs_internal$',
    # The last control message that fills the buffer ends the walk either way.
    'src/internal/sys/message\.rs:\d+:17: replace > with >= in ancillary_info$',
    # The end of an association that was shut down is told apart from the errors that
    # end one by a number that is no error number: -1 or 1, EPERM, which ends no
    # association (`SHUT_DOWN`).
    'src/internal\.rs:\d+:\d+: delete -$',
    # The EINVAL of the status of an association whose connect failed is said as
    # ECONNREFUSED: Linux sets SO_ERROR before it deletes such an association, and the
    # loop reads SO_ERROR first, so only a failure between the two calls reaches it.
    'src/internal\.rs:\d+:45: replace == with != in SocketCore::connect$',
    # A batch of reads interrupted by a signal: it does not wait, so no signal interrupts
    # it.
    'src/internal\.rs:.*: replace match guard error\.kind\(\) == std::io::ErrorKind::Interrupted with false in SocketCore::receive_batch_once$',
    # The loss of the association of a one-to-one socket, in an association change: the
    # error that Linux gives the socket with it, which this arm reads, is what the next
    # call reads in its place, and that call records the same end.
    'src/internal\.rs:.*: delete match arm AssocChangeState::CommLost in SocketCore::note_received$',
    # The notifications of a socket of one association other than its association changes,
    # which the arm before this one takes: `quiet` keeps back association changes alone.
    'src/internal\.rs:.*: replace match guard self\.quiet\(notification\) with false in SocketCore::note_received$',
    # After the end, the socket is shut down for reading: a read gives what the kernel
    # holds, InvalidData for a message past the limit, or the end, and no other error.
    'src/internal\.rs:.*: replace match guard error\.kind\(\) == std::io::ErrorKind::InvalidData with true in SocketCore::after_the_end$',
    # A single message has no next to bundle with: the mutant reads the send buffer, and
    # sends it alike.
    'src/internal\.rs:\d+:39: replace > with >= in SocketCore::send_flagged$',
    # Streams known short by one, or the status asked again, make the batch ask the
    # status of the association, which gives the streams that it has: the same flags.
    'src/internal\.rs:\d+:64: replace \+ with \* in SocketCore::send_flagged$',
    'src/internal\.rs:\d+:43: replace && with \|\| in SocketCore::send_flagged$',
    # A run that the kernel took in part is tried again at once: it takes nothing more
    # (EAGAIN), or more, and the count returned is what it took.
    'src/internal\.rs:\d+:30: replace < with > in SocketCore::send_flagged$',
]
