# oxirush-sctp beside the other SCTP crates of crates.io, at pinned versions,
# through the same loops: `../compare.sh` builds this and the program in C
# beside it, runs them and prints the table. A package of its own, so that
# neither the crate nor its benchmarks depend on the others.
[package]
name = "oxirush-sctp-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[dependencies]
oxirush-sctp = { path = "../.." }
async-sctp = "=1.0.0"
lksctp = "=0.1.0"
sctp-rs = "=0.3.1"
tokio-sctp = "=0.2.0"
bytes = "1"
libc = "0.2"
tokio = { version = "1.32", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[profile.release]
debug = 1

# Not a member of a workspace that the crate may be in.
[workspace]
